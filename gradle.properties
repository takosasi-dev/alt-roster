# file.encoding は UTF-8 へ上書きしない。
# プロジェクトのパスに日本語が入っている状態でデーモン側だけ UTF-8 にすると、
# テストのワーカーへ渡すクラスパスの復号がずれて :core:test が ClassNotFoundException で落ちる
# (同じ作者の収支管理アプリで実際に踏んだ)。両側とも OS の既定のまま揃えておく。
org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
